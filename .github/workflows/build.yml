name: Build Linux AppImage
on: [push, workflow_dispatch]
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare checksum-verified official runtime and packaging tools
        run: node scripts/prepare-linux-runtime.cjs
      - run: npm test
      - run: dbus-run-session -- npm run test:mpris
      - run: sh -n scripts/start-yamu.sh scripts/start-yamu-gamemode.sh
      - run: xvfb-run -a npm run test:ui
      - run: xvfb-run -a npm run test:ui -- --steam-deck
      - name: Build AppImage and Linux archive (retry transient downloads)
        run: |
          for attempt in 1 2 3; do
            npm run dist:linux -- --config.electronDist=.tools/electron-runtime && exit 0
            sleep 5
          done
          exit 1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPIMAGE_TOOLS_PATH: ${{ github.workspace }}/.tools/appimage-tools
          ELECTRON_BUILDER_7ZIP_PATH: /usr/bin/7z
      - uses: actions/upload-artifact@v4
        with:
          name: Yamu-SteamDeck-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
